openapi: 3.0.4
info:
  title: URL Unshortener
  description: >-
    URL Unshortener expands shortened links to reveal their final destination
    URL and destination domain. Send any short link to inspect the resolved
    address and redirect count; paid plans add the full redirect chain.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/urlunshortener:
    post:
      summary: URL Unshortener
      description: Unshorten a shortened URL
      operationId: urlunshortener
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  source: https://bit.ly/3k3j4
                  destination: http://www.allclimbing.com/archive/2009/09/climbing-video-alex-puccio-on-trice-v12/
                  unshortened: true
                  redirectCount: 1
                  destinationDomain: www.allclimbing.com
                  redirectChain:
                    - https://bit.ly/3k3j4
                    - http://www.allclimbing.com/archive/2009/09/climbing-video-alex-puccio-on-trice-v12/
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The shortened URL to unshorten
              required:
                - url
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  url: https://bit.ly/3k3j4
